[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sysrescueos"
version = "0.1.0"
description = "Read-only PC diagnostics toolkit for a future Linux live environment."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ericsnet" }]
dependencies = []

[project.scripts]
sysrescue = "sysrescue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
